<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignar Stand</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Asignar Stand</h4>
            </div>
            <div class="card-body">
                <p><strong>Emprendimiento:</strong> {{ artesano.solicitud.nombre_emprendimiento }}</p>
                <p><strong>Titular:</strong> {{ artesano.solicitud.nombre_apellido }}</p>
                <hr>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="stand" class="form-label text-primary fw-bold">Seleccionar un Stand Disponible:</label>
                        <select name="stand_id" id="stand" class="form-select" required>
                            <option value="">-- Elegir Stand --</option>
                            {% for stand in stands %}
                                <option value="{{ stand.id }}">
                                    {{ stand.pabellon }} - Puesto {{ stand.numero_puesto }} ({{ stand.dimensiones }})
                                </option>
                            {% empty %}
                                <option value="" disabled>No hay stands disponibles en este momento</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'artesanos:listar_solicitudes' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Asignacion</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
